# ==============================================================================
# EXP-9: Containerization - Docker Compose multi-service deployment
# ==============================================================================
version: "3.8"

services:
  disasterwatch-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: disasterwatch_app
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - PORT=8000
